                  return (int) (value * getResources().getDisplayMetrics().density);
              }

              private TextView label(String text, int size, int color) {
                  TextView view = new TextView(this);
                  view.setText(text);
                  view.setTextSize(size);
                  view.setTextColor(color);
                  view.setPadding(dp(12), dp(8), dp(12), dp(8));
                  return view;
              }

              private Button button(String text, int color) {
                  Button button = new Button(this);
                  button.setText(text);
                  button.setTextColor(Color.WHITE);
                  button.setTextSize(15);
                  button.setAllCaps(false);
                  button.setBackgroundColor(color);

                  LinearLayout.LayoutParams params = new LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT,
                      LinearLayout.LayoutParams.WRAP_CONTENT
                  );

                  params.setMargins(dp(10), dp(6), dp(10), dp(6));
                  button.setLayoutParams(params);
                  return button;
              }

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(12), dp(18), dp(12), dp(12));
                  root.setBackgroundColor(Color.rgb(13, 17, 23));

                  TextView title = label("💹 FinSim Clone", 28, Color.rgb(0, 212, 255));
                  title.setGravity(Gravity.CENTER);
                  title.setTypeface(null, Typeface.BOLD);
                  root.addView(title);

                  TextView subtitle = label(
                      "Торгуй акциями. Манипулируй рынком. Не попадись SEC.",
                      14,
                      Color.LTGRAY
                  );
                  subtitle.setGravity(Gravity.CENTER);
                  root.addView(subtitle);

                  cashText = label("", 19, Color.WHITE);
                  priceText = label("", 22, Color.rgb(46, 204, 113));
                  stocksText = label("", 16, Color.LTGRAY);
                  secText = label("", 16, Color.rgb(241, 196, 15));
                  newsText = label("", 14, Color
