name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      - name: Скачать репозиторий
        uses: actions/checkout@v4

      - name: Найти ZIP
        shell: bash
        run: |
          echo "Файлы репозитория:"
          find . -maxdepth 3 -type f | sort

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ОШИБКА: ZIP-файл не найден"
            exit 1
          fi

          echo "Найден ZIP: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Распаковать ZIP
        shell: bash
        run: |
          rm -rf extracted
          mkdir extracted

          unzip -o "$ZIP_FILE" -d extracted

          echo "Содержимое ZIP:"
          find extracted -maxdepth 5 -type f | sort

      - name: Найти корень Android проекта
        shell: bash
        run: |
          SETTINGS_FILE=$(find extracted \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ОШИБКА: settings.gradle или settings.gradle.kts не найден"
            echo "Проверяем содержимое:"
            find extracted -maxdepth 8 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Найден Gradle проект:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Показать структуру проекта
        shell: bash
        run: |
          echo "Корень проекта:"
          echo "$PROJECT_DIR"

          echo ""
          echo "Файлы:"
          find "$PROJECT_DIR" -maxdepth 4 -type f | sort

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Установить Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Собрать APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "Сборка из:"
          pwd

          echo ""
          echo "Запускаем Gradle..."

          gradle assembleDebug --no-daemon

      - name: Проверить APK
        shell: bash
        run: |
          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ОШИБКА: APK не найден"
            exit 1
          fi

          echo "APK найден:"
          ls -lh "$APK"

          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: MarketForge-APK
          path: ${{ env.APK }}
          retention-days: 30
