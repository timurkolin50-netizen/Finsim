name: Build MarketForge APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Скачать файлы репозитория
        uses: actions/checkout@v4

      - name: Найти ZIP
        run: |
          echo "Файлы в репозитории:"
          find . -maxdepth 2 -type f

      - name: Распаковать MarketForge ZIP
        run: |
          mkdir extracted
          unzip -o MarketForge-Android.zip -d extracted

          echo "Распакованные файлы:"
          find extracted -type f

      - name: Перенести файлы проекта
        run: |
          cp -r extracted/* .
          cp -r extracted/.[!.]* . 2>/dev/null || true

          echo "Структура проекта:"
          find . -maxdepth 3 -type f | sort

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Установить Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Собрать APK
        run: |
          gradle assembleDebug --no-daemon

      - name: Проверить APK
        run: |
          ls -lh app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: MarketForge-APK
          path: app/build/outputs/apk/debug/app-debug.apk
